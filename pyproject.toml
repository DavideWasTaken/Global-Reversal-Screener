[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-swing-selector"
version = "0.1.0"
description = "Rule-based long-only swing stock selector with cross-sectional ranking and explicit cash state."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pyarrow>=17,<23",
  "yfinance>=0.2.54,<2",
  "lxml>=5,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]

[project.scripts]
swing-picker = "swing_picker.cli:main"

[tool.setuptools.packages.find]
include = ["swing_picker*"]

[tool.pytest.ini_options]
testpaths = ["tests_swing"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
