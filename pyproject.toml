[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "global-reversal-screener"
version = "1.0.0"
description = "Global stock screener: significant correction near support, early bullish momentum turn, rising FCF, profitability, 3D OBV divergence, size and multi-model valuation gates."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Davide Gaglione" }]
requires-python = ">=3.10"
keywords = ["stock-screener", "finance", "technical-analysis", "valuation", "ftse-all-world"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Intended Audience :: Financial and Insurance Industry",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/DavideWasTaken/Global-Reversal-Screener"

[project.scripts]
reversal-screener = "reversal_screener.cli:main"

[tool.setuptools.packages.find]
include = ["reversal_screener*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
