[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ftse-stock-finder"
version = "0.2.0"
description = "Global value-quality screener with downtrend, rising FCF, profitability, 3D OBV divergence, size and multi-model valuation gates."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
]

[project.scripts]
stock-finder = "stock_finder.cli:main"

[tool.setuptools.packages.find]
include = ["stock_finder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
