name: checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Compile
        run: python -m compileall -q reversal_screener examples tests
      - name: CLI smoke test
        run: |
          reversal-screener --help
          python -m reversal_screener scan --help
      - name: Test
        run: pytest -q
